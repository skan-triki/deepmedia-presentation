<!DOCTYPE html>

<html data-lang="{{LANG}}" data-theme="dark" lang="{{LANG}}">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
{{CSS}}
</style>
</head>
<body>
<!-- ── SVG sprite ──────────────────────────────────────── -->
{{SVG}}
<!-- ── Deck ────────────────────────────────────────────── -->
<div class="deck">
<div class="deck__fit">
<div aria-hidden="true" class="deck__bg">
<div class="deck__bg-blob deck__bg-blob--1"></div>
<div class="deck__bg-blob deck__bg-blob--2"></div>
<div class="deck__bg-blob deck__bg-blob--3"></div>
<div class="deck__bg-blob deck__bg-blob--4"></div>
<div class="deck__bg-blob deck__bg-blob--5"></div>
</div>
<div class="deck__slides" id="deck-slides">
{{SLIDES}}</div><!-- /deck__slides -->
</div><!-- /deck__fit -->
</div><!-- /deck -->

<!-- Mobile persistent bottom bar (9:16 vertical smartphone) -->
<div class="deck__mobile-bar" aria-label="Slide navigation">
  <button class="deck__mobile-bar-btn" data-action="prev" aria-label="Previous slide"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
  <span class="deck__mobile-bar-info"><span class="deck__mobile-bar-current">01</span><span>/</span><span class="deck__mobile-bar-total">22</span></span>
  <button class="deck__mobile-bar-btn" data-action="next" aria-label="Next slide"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
</div>

<script>
{{JS}}
</script>
</body>
</html>
